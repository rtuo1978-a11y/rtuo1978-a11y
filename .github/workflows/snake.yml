name: Serpent de contributions

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Générer le serpent
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-nuit.svg?palette=github-dark&color_snake=#F4A6C6&color_dots=#1B2450,#4B3A6B,#8E3F73,#E2558F,#F6C945&color_background=#131A3A
            dist/snake-clair.svg?color_snake=#E2558F&color_dots=#EEF0F6,#F9D3E3,#F4A6C6,#E2558F,#F6C945

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
